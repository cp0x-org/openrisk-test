# Manual-only twin of collect.yml.
#
# Why it exists: workflow_dispatch only shows a "Run workflow" button for files
# that live on the default branch, and the ref picker then runs the YAML found at
# that ref. This workflow instead stays on main and takes the branch as an input,
# so it can build any branch without that branch needing a copy of the file.
name: Manual collect (pick branch)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run the collectors from"
        required: true
        default: data-artifacts
        type: string
      data_tag:
        description: "Release tag to read the previous data from and publish to"
        required: true
        default: data-latest
        type: string

# contents: write is needed to publish the rolling data release, not to push commits
permissions:
  contents: write

# Shared with the scheduled collect so two runs never fight over the same release tag
concurrency:
  group: collect-data
  cancel-in-progress: false

env:
  DATA_TAG: ${{ inputs.data_tag }}
  DATA_BUNDLE: openrisk-data.tar.gz

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Report target
        run: |
          echo "### Manual collect" >> "$GITHUB_STEP_SUMMARY"
          echo "- branch: \`${{ inputs.branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- release tag: \`${{ inputs.data_tag }}\`" >> "$GITHUB_STEP_SUMMARY"

      # The workflow comes from main, the code being run comes from the input branch
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Collected data no longer lives in git. Restore the previous run's output
      # first so a feed that fails today keeps yesterday's assessments instead of
      # silently collapsing to "no data".
      - name: Restore previous data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release download "$DATA_TAG" --pattern "$DATA_BUNDLE" --dir "$RUNNER_TEMP" 2>/dev/null; then
            tar -xzf "$RUNNER_TEMP/$DATA_BUNDLE" -C data
            echo "Restored previous data from release $DATA_TAG"
          else
            echo "No $DATA_TAG release yet — starting from curated files only"
          fi

      - name: Run collectors
        run: npm run collect

      - name: Package data
        run: |
          mkdir -p data/live data/coverage
          tar -czf "$RUNNER_TEMP/$DATA_BUNDLE" -C data live coverage feeds.json snapshot.json
          ls -l data/snapshot.json "$RUNNER_TEMP/$DATA_BUNDLE"

      # Transport for the Pages build (private to Actions, 30-day retention)
      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrisk-data
          path: |
            data/live
            data/coverage
            data/feeds.json
            data/snapshot.json
          retention-days: 30
          if-no-files-found: error

      # Public open-data endpoint (stable URL, no auth, no retention limit)
      - name: Publish data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$DATA_TAG" >/dev/null 2>&1; then
            gh release create "$DATA_TAG" \
              --title "Latest collected data" \
              --notes "Rolling release. Overwritten by every successful Collect run — do not link to it as an immutable snapshot." \
              --latest=false
          fi
          gh release upload "$DATA_TAG" \
            data/snapshot.json \
            "$RUNNER_TEMP/$DATA_BUNDLE" \
            --clobber

      - name: Report result
        run: |
          echo "- collect run id (feed it to Manual deploy Pages): \`${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
