name: Collect data

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    # Do NOT watch data/coverage or data/live — collectors write those and
    # would re-trigger themselves forever (timestamp churn every run).
    paths:
      - "data/protocols/**"
      - "data/feeds.json"
      - "collectors/**"
      - "collectors/config/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: true

jobs:
  collect:
    # Extra guard: bot data commits must never start another collect
    if: |
      github.event_name != 'push' ||
      (
        !contains(github.event.head_commit.message, 'chore(data):') &&
        !contains(github.event.head_commit.message, '[skip collect]')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_PUSH_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Run collectors
        run: npm run collect

      - name: Commit updated data
        run: |
          git config user.name "openrisk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live data/coverage data/snapshot.json
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "chore(data): refresh live metrics and feed assessments [skip collect]"
          git push
