name: Collect data

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/protocols/**"
      - "data/coverage/**"
      - "data/feeds.json"
      - "collectors/**"
      - "collectors/config/**"

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_PUSH_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Run collectors
        run: npm run collect

      - name: Commit updated data
        run: |
          git config user.name "openrisk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live data/coverage data/snapshot.json
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "chore(data): refresh live metrics and feed assessments"
          git push
